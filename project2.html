<!DOCTYPE html>
<html lang="en">
<head>

</head>
<style>
  .control{
    display: flex;
  width: 250px;
  height: 50px;
  column-gap: 1px;
  }
  .face{
    background-image: url(instab.png);
    background-repeat: no-repeat;
    background-size: 20% 20%;
    width: 200px;
    height: 200px;
  }
  .insta{
     background-image: url(faceb.png);
     background-repeat: no-repeat;
     background-size: 20% 20%;
    width: 200px;
    height: 200px;
  }
  .twitter{
     background-image: url(twitterb.png);
     background-repeat: no-repeat;
     background-size: 20% 20%;
    width: 200px;
    height: 200px;
  }
  .you{
     background-image: url(youb.png);
     background-repeat: no-repeat;
     background-size: 20% 20%;
    width: 200px;
    height: 200px;
  }
.face:hover{
  background-image: url(insta.jpg);
  background-repeat: no-repeat;

}
.insta:hover{
  background-image: url(face.png);
  background-repeat: no-repeat;
  
}
.twitter:hover{
  background-image: url(twitter.png);
  background-repeat: no-repeat;
  width: 200px;
}
.you:hover{
  background-image: url(youtube.jpg);
}
</style>
<div class="control">
  <div class="face"></div>
    <div class="insta"></div>
      <div class="twitter"></div>
    <div class="you"></div>
</div>

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mens Dress Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background-color: black;color: white;
        position: relative;
    top: 50px;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 8px; box-sizing: border-box; }
        .result { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: green; }
         .star1{
            background-image: url("video.jpg");
            background-repeat: no-repeat;
            border: 3px solid black;
           background-size: 100% 100%;
           width: 800px;
           height: 500px;
           position: relative;
           left: 350px;
           top: 260px;
        }
        .star1:hover{
            background-image: url(second.jpg);
            background-repeat: no-repeat;
        }
       h1{
        text-align: center;
       }
       button{
        position: relative;
        left: 150px;
       }
        .fot{
            border: 2px solid black;
            width: 600px;
            height: 150px;
            position: relative;
            left: 27%;
            top: 160px;
            justify-content: center;
            text-align: center;
        }
        
    </style>
</head>
<body>
<div class="container">
    <h1>Order Form</h1>
    
    <!-- Dress Name -->
    <div class="form-group">
        <label for="dressName">Dress Name:</label>
        <select id="dressName" onchange="updateRate()">
            <option value="0" data-rate="0">Select Dress</option>
            <option value="Shirt" data-rate="1000">kids dress(₹1000)</option>
            <option value="Shirt" data-rate="1000">Formal Shirt (₹2000)</option>
            <option value="Jeans" data-rate="2000">Jeans (₹2000)</option>
            <option value="Blazer" data-rate="5000">vesti Shirt(₹5000)</option>
        </select>
    </div>

    <!-- Size -->
    <div class="form-group">
        <label for="size">Size:</label>
        <select id="size">
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
        </select>
    </div>

    <!-- Rate (Auto-filled) -->
    <div class="form-group">
        <label for="rate">Rate (₹):</label>
        <input type="text" id="rate" readonly>
    </div>

    <!-- Quantity -->
    <div class="form-group">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" value="1" min="1" oninput="calculateTotal()">
    </div>
     <button class="no-print" onclick="window.print()">Print Bill</button>
    <!-- Total Rate -->
    <div class="result">
        Total: ₹<span id="totalRate">0</span>
    </div>
</div>
<div class="fot">
 <h1>Thank You & Branding (Polite)</h1>
<p>"Thank you for shopping with us! We hope you love your new outfit."</p>
<p>"You look fabulous! Thank you for choosing [MENSHUB]."</p>
</div><br>
<div class="star1">
    <a href="image8.jpg"></a>
</div>
   
    

<script>
    function updateRate() {
        var dressSelect = document.getElementById("dressName");
        var selectedOption = dressSelect.options[dressSelect.selectedIndex];
        var rate = selectedOption.getAttribute("data-rate");
        
        document.getElementById("rate").value = rate;
        calculateTotal();
    } 

    function calculateTotal() {
        var rate = document.getElementById("rate").value;
        var quantity = document.getElementById("quantity").value;
        var total = rate * quantity;
        document.getElementById("totalRate").innerText = total;
    }
      const items = 2;
    if (items > 1) {
        document.getElementById("alertBox").style.display = "block";
    }
</script>

</body>
</html>
